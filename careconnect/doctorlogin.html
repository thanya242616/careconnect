
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareConnect - Doctor Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f7f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000012;
}

h2 {
    text-align: center;
    color: #087f8c;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #71818a;
    font-size: 14px;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccdadd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #087f8c;
}

button {
    width: 100%;
    background: #087f8c;
    color: white;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #05636e;
}

.links {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    line-height: 2;
}

a {
    color: #087f8c;
    text-decoration: none;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <h2>♥ CareConnect</h2>
    <p class="subtitle">Doctor Login</p>

    <form action="doctorlogin.php" method="POST">

        <div class="form-group">
            <label>Doctor ID</label>
            <input type="text"
                   name="doctor_id"
                   placeholder="Enter Doctor ID"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="links">
        Don't have an account?
        <a href="doctorsignup.html">Create Account</a>
        <br>
        <a href="index.html">Back to Home</a>
    </div>

</div>

</body>
</html>
