
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareConnect - Patient Profile</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f7fb;
            margin: 0;
            color: #263746;
        }

        header {
            background-color: #176b87;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .profile-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-heading h2 {
            color: #176b87;
            margin-top: 15px;
        }

        /* Profile Photo */

        .profile-photo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-photo {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #176b87;
            background-color: #dceef4;
        }

        .photo-label {
            display: inline-block;
            background-color: #176b87;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 14px;
        }

        .photo-label:hover {
            background-color: #10536b;
        }

        #photoInput {
            display: none;
        }

        /* Form */

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #f8fafc;
        }

        input:disabled,
        select:disabled,
        textarea:disabled {
            color: #555;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .edit {
            background-color: #176b87;
            color: white;
        }

        .save {
            background-color: #198754;
            color: white;
        }

        .cancel {
            background-color: #6c757d;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #176b87;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .note {
            color: #777;
            font-size: 13px;
            margin-top: 20px;
            line-height: 1.5;
        }

        @media(max-width: 600px) {
            .container {
                width: 94%;
            }

            .card {
                padding: 20px;
            }
        }

    </style>

</head>

<body>

<header>
    <h1>♥ CareConnect</h1>
    <p>Your Health. Your Records. Your Control.</p>
</header>

<div class="container">

    <div class="card">

        <div class="profile-heading">

            <div class="profile-photo-container">

                <img
                    id="profileImage"
                    src="https://placehold.co/125x125/dceef4/176b87?text=Patient"
                    alt="Patient Profile Photo"
                    class="profile-photo"
                >

                <br>

                <label for="photoInput" class="photo-label">
                    Change Profile Photo
                </label>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                >

            </div>

            <h2>Patient Profile</h2>

            <p>View and manage your personal information</p>

        </div>

        <form id="profileForm">

            <label for="patientId">Patient ID</label>

            <input
                type="text"
                id="patientId"
                placeholder="Patient ID"
                disabled
                required
            >

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter full name"
                disabled
                required
            >

            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
                min="1"
                max="120"
                disabled
                required
            >

            <label for="gender">Gender</label>

            <select id="gender" disabled required>

                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>

            </select>

            <label for="mobile">Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                disabled
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
                disabled
                required
            >

            <label for="address">Address</label>

            <textarea
                id="address"
                rows="3"
                placeholder="Enter your full address"
                disabled
                required
            ></textarea>

            <label for="blood">Blood Group</label>

            <select id="blood" disabled>

                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
                <option>Unknown</option>

            </select>

            <div class="buttons">

                <button
                    type="button"
                    class="edit"
                    id="editBtn"
                    onclick="enableEdit()"
                >
                    Edit Profile
                </button>

                <button
                    type="submit"
                    class="save"
                    id="saveBtn"
                    style="display:none;"
                >
                    Save Changes
                </button>

                <button
                    type="button"
                    class="cancel"
                    id="cancelBtn"
                    style="display:none;"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </div>

        </form>

        <p class="note">
            Keep your personal information updated.
            Your medical records should remain private and secure.
        </p>

    </div>

    <a class="back" href="patient.html">
        ← Back to Patient Dashboard
    </a>

</div>

<script>

    const form = document.getElementById("profileForm");

    const photoInput = document.getElementById("photoInput");

    const profileImage = document.getElementById("profileImage");

    const fields = [
        "patientId",
        "name",
        "age",
        "gender",
        "mobile",
        "email",
        "address",
        "blood"
    ];

    let originalData = {};

    let originalPhoto = "";

    // Initially photo upload is disabled

    photoInput.disabled = true;

    // Photo Preview

    photoInput.addEventListener("change", function() {

        const file = this.files[0];

        if (file) {

            if (!file.type.startsWith("image/")) {

                alert("Please select an image file.");

                this.value = "";

                return;
            }

            const reader = new FileReader();

            reader.onload = function(event) {

                profileImage.src = event.target.result;

            };

            reader.readAsDataURL(file);

        }

    });

    // Enable Edit

    function enableEdit() {

        fields.forEach(id => {

            originalData[id] =
                document.getElementById(id).value;

            document.getElementById(id).disabled = false;

        });

        originalPhoto = profileImage.src;

        photoInput.disabled = false;

        document.getElementById("editBtn").style.display = "none";

        document.getElementById("saveBtn").style.display = "inline-block";

        document.getElementById("cancelBtn").style.display = "inline-block";

    }

    // Cancel Editing

    function cancelEdit() {

        fields.forEach(id => {

            document.getElementById(id).value = originalData[id];

            document.getElementById(id).disabled = true;

        });

        profileImage.src = originalPhoto;

        photoInput.value = "";

        photoInput.disabled = true;

        document.getElementById("editBtn").style.display = "inline-block";

        document.getElementById("saveBtn").style.display = "none";

        document.getElementById("cancelBtn").style.display = "none";

    }

    // Save Profile

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        fields.forEach(id => {

            document.getElementById(id).disabled = true;

        });

        photoInput.disabled = true;

        document.getElementById("editBtn").style.display = "inline-block";

        document.getElementById("saveBtn").style.display = "none";

        document.getElementById("cancelBtn").style.display = "none";

        alert("Profile updated successfully!");

    });

</script>

</body>
</html>
