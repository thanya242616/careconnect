
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareConnect - Doctor Signup</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f7f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000012;
}

h2 {
    text-align: center;
    color: #087f8c;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #71818a;
    font-size: 14px;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccdadd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #087f8c;
}

button {
    width: 100%;
    background: #087f8c;
    color: white;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #05636e;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
}

.login-link a {
    color: #087f8c;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h2>♥ CareConnect</h2>
    <p class="subtitle">Doctor Signup</p>

    <form action="doctorsignup.php" method="POST">

        <div class="form-group">
            <label>Doctor Name</label>
            <input type="text" name="doctor_name"
                   placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Doctor ID</label>
            <input type="text" name="doctor_id"
                   placeholder="Enter Doctor ID" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter email address" required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="mobile"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   placeholder="Enter 10-digit mobile number"
                   required>
        </div>

        <div class="form-group">
            <label>Specialization</label>
            <select name="specialization" required>
                <option value="">Select Specialization</option>
                <option>General Medicine</option>
                <option>Cardiology</option>
                <option>Dermatology</option>
                <option>Orthopedics</option>
                <option>Neurology</option>
                <option>Pediatrics</option>
                <option>Gynecology</option>
            </select>
        </div>

        <div class="form-group">
            <label>Hospital Name</label>
            <input type="text" name="hospital"
                   placeholder="Enter hospital name" required>
        </div>

        <div class="form-group">
            <label>Medical Registration Number</label>
            <input type="text" name="registration_no"
                   placeholder="Enter registration number" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm password"
                   minlength="8" required>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="doctorlogin.html">Login</a>
    </div>

</div>

</body>
</html>
