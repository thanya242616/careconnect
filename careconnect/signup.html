<!DOCTYPE html>
<html>
<head>
    <title>CareConnect - Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-box {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d4f82;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>CareConnect</h1>
    <h2>Patient Registration</h2>

    <form action="signup.php" method="POST">

        <label>Full Name</label>
        <input type="text"
               name="full_name"
               placeholder="Enter your full name"
               required>

        <label>Date of Birth</label>
        <input type="date"
               name="date_of_birth"
               required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>Mobile Number</label>
        <input type="tel"
               name="mobile"
               placeholder="Enter mobile number"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter email address">

        <label>Address</label>
        <input type="text"
               name="address"
               placeholder="Enter your address">

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Create password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirm_password"
               placeholder="Confirm password"
               required>

        <button type="submit">Create Account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

</body>
</html>
