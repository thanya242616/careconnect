
<!DOCTYPE html>
<html>
<head>
    <title>CareConnect - Consultation Status</title>
<meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7fb;
            margin: 0;
            padding: 20px;
            color: #263746;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            background: #087f8c;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 12px;
        }

        .header h2 {
            margin: 0;
        }

        .section-title {
            margin-top: 30px;
            color: #087f8c;
        }

        .appointment-card {
            background: white;
            padding: 25px;
            margin-top: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            border-left: 5px solid #087f8c;
        }

        .status {
            display: inline-block;
            background: #e1f7e8;
            color: #16803c;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            background: #f5f9fc;
            padding: 13px;
            border-radius: 8px;
        }

        .label {
            color: #718096;
            font-size: 13px;
        }

        .value {
            font-weight: bold;
            margin-top: 6px;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            margin-top: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .empty-icon {
            font-size: 45px;
        }

        .empty h3 {
            color: #087f8c;
        }

        .empty p {
            color: #718096;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }

        .book-btn {
            background: #087f8c;
            color: white;
        }

        .dashboard-btn {
            background: #1769aa;
            color: white;
            margin-left: 10px;
        }

        .cancel-btn {
            background: #e74c3c;
            color: white;
        }

        @media(max-width: 600px) {
            .details {
                grid-template-columns: 1fr;
            }

            .dashboard-btn {
                margin-left: 0;
            }
        }
        .emoji {
    font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
}
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>🩺 Consultation Status</h2>
        <p>CareConnect - Your Health. Your Records. Your Control.</p>
    </div>

    <h3 class="section-title">🏥 Hospital Consultation</h3>

    <div id="hospitalSection"></div>

    <h3 class="section-title">💻 Online Consultation</h3>

    <div id="onlineSection"></div>

    <div class="empty" id="emptyMessage">

        <div class="empty-icon">📅</div>

        <h3>No Active Consultations</h3>

        <p>
            You have not booked any consultation yet.
            Your appointment details will appear here after booking.
        </p>

        <button class="book-btn"
                onclick="location.href='appointment.html'">
            ➕ Book Appointment
        </button>

    </div>

    <button class="dashboard-btn"
            onclick="location.href='patient.html'">
        🏠 Back to Dashboard
    </button>

</div>

<script>

    // Initially no appointments are available

    let hospitalAppointments = [];
    let onlineAppointments = [];

    function displayAppointments() {

        let hospitalSection =
            document.getElementById("hospitalSection");

        let onlineSection =
            document.getElementById("onlineSection");

        let emptyMessage =
            document.getElementById("emptyMessage");

        hospitalSection.innerHTML = "";
        onlineSection.innerHTML = "";

        if (hospitalAppointments.length === 0 &&
            onlineAppointments.length === 0) {

            emptyMessage.style.display = "block";
            return;
        }

        emptyMessage.style.display = "none";

        hospitalAppointments.forEach(function(appointment) {

            hospitalSection.innerHTML += `
                <div class="appointment-card">

                    <h3>🏥 Hospital Appointment</h3>

                    <span class="status">
                        ✅ ${appointment.status}
                    </span>

                    <div class="details">

                        <div class="detail">
                            <div class="label">Appointment ID</div>
                            <div class="value">${appointment.id}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Doctor Name</div>
                            <div class="value">${appointment.doctor}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Hospital</div>
                            <div class="value">${appointment.hospital}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Specialization</div>
                            <div class="value">${appointment.specialization}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Date</div>
                            <div class="value">${appointment.date}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Time</div>
                            <div class="value">${appointment.time}</div>
                        </div>

                    </div>

                </div>
            `;
        });

        onlineAppointments.forEach(function(appointment) {

            onlineSection.innerHTML += `
                <div class="appointment-card">

                    <h3>💻 Online Consultation</h3>

                    <span class="status">
                        ✅ ${appointment.status}
                    </span>

                    <div class="details">

                        <div class="detail">
                            <div class="label">Appointment ID</div>
                            <div class="value">${appointment.id}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Doctor Name</div>
                            <div class="value">${appointment.doctor}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Specialization</div>
                            <div class="value">${appointment.specialization}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Consultation Mode</div>
                            <div class="value">${appointment.mode}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Date</div>
                            <div class="value">${appointment.date}</div>
                        </div>

                        <div class="detail">
                            <div class="label">Time</div>
                            <div class="value">${appointment.time}</div>
                        </div>

                    </div>

                </div>
            `;
        });

    }

    displayAppointments();

</script>

</body>
</html>
