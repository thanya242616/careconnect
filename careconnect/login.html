<!DOCTYPE html>
<html>
<head>
    <title>CareConnect - Patient Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            width: 350px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            color: #1769aa;
            margin-bottom: 5px;
        }

        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d4f82;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>CareConnect</h1>

        <h2>Patient Login</h2>

        <!-- Login Form -->
        <form action="login.php" method="POST">

            <label>Patient ID</label>

            <input
                type="text"
                name="patient_id"
                placeholder="Enter Patient ID"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="links">

 

    <p>
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </p>

</div>

    </div>

</body>
</html>
